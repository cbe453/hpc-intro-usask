# Customization for Newcastle University's Comet Cluster
# Use the HPC_CARPENTRY_CUSTOMIZATION variable to invoke these:
#
# > HPC_CARPENTRY_CUSTOMIZATION=episodes/files/customization/NCL_Comet_slurm/_config_options.yml
# > export HPC_CARPENTRY_CUSTOMIZATION
---
snippets: episodes/files/customization/Plato_slurm/snippets/

local:
  prompt: "[you@laptop:~]$"
  shebang: "#!/usr/bin/env bash"

remote:
  name: "Plato"
  host_id: "FIXME_Plato"
  login: "plato.usask.ca"
  host: "platolgn001"
  node: "platocpu028"
  location: "plato.usask.ca"
  user: "abc123"
  prompt: '[abc123@platolgn001 ~]'
  shebang: "#!/bin/bash"
  home: "/home"

  fs:
    home: "/home"

  module_python3:
    python: "python/3.11.5"

  modules:
    python: "python/3.11.5"

sched:
  name: "Slurm"
  submit:
    name: "sbatch"
    options: "--account=hpc_s_workshop"
  queue:
    debug: "N/A"
    testing: "short_free"
  reservation: "shortqos"
  qos: "short"
  account: "comet_training"
  project: "FIXME_comet_training"
  comment: '#SBATCH'
  status: "squeue"
  flag:
    user: "-u abc123"
    interactive: ""
    histdetail: "--long --jobs"
    name:    "--job-name"
    account: "--account"
    array:   "--array"
    time:    "--time"
    queue:   "--partition"
    nodes:   "--nodes"
    tasks:   "--ntasks"
    threads: "--cpus-per-task"
    outputfile: "--output"
  del: "scancel"  
  interactive: "srun"
  info: "sinfo"
  hist: "sacct -u yourUsername"
  hist_filter: ""